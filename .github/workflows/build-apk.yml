name: Build APK (v2)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Full write access for the workflow token (artifacts, releases, checks).
permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build release APK (debug-signed, installable)
        continue-on-error: true
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APKs v2
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/FloatingPen-v2-debug.apk
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk out/FloatingPen-v2-release.apk
          fi
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FloatingPen-v2-apk
          path: out/*.apk

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
